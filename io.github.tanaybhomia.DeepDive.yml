app-id: io.github.tanaybhomia.DeepDive
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: deepdive
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: deepdive
    buildsystem: meson
    sources:
      - type: dir
        path: .
